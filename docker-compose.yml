services:
  db:
    image: postgres:16-alpine
    container_name: pointeresto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-pointeresto}
      POSTGRES_USER: ${PGUSER:-pointeresto_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-pointeresto_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pointeresto_user} -d ${PGDATABASE:-pointeresto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pointeresto_redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pointeresto_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET: ${APP_SECRET:-pointeresto-hmac-secret-key-2026}
      PORT: 8000
      DATABASE_URL: postgresql://${PGUSER:-pointeresto_user}:${PGPASSWORD:-pointeresto_pass}@db:5432/${PGDATABASE:-pointeresto}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/Backend/Public/uploads

  frontend:
    image: nginx:alpine
    container_name: pointeresto_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads_data: