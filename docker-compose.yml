services:
  db:
    image: postgres:16-alpine
    container_name: pointeresto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pointeresto}
      POSTGRES_USER: ${POSTGRES_USER:-pointeresto_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pointeresto_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pointeresto_user} -d ${POSTGRES_DB:-pointeresto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pointeresto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pointeresto-api
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pointeresto_user:pointeresto_pass@db:5432/pointeresto}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - ./Backend/Public/uploads:/var/www/html/Public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: