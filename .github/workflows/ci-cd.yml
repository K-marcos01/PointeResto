name: CI/CD — PointeResto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Qualité PHP/HTML, Migration PostgreSQL & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pointeresto_test
          POSTGRES_USER: pointeresto_user
          POSTGRES_PASSWORD: pointeresto_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pointeresto_user -d pointeresto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Vérification sécurité (aucun fichier .env suivi ni style inline HTML)
        run: |
          if [ -n "$(git ls-files .env Backend/.env)" ]; then
            echo "Erreur critique : un fichier .env est suivi par Git !"
            exit 1
          fi
          if grep -rn 'style=' Frontend/*.html; then
            echo "Erreur qualité : des attributs style= inline subsistent dans Frontend/*.html !"
            exit 1
          fi

      - name: Installation de PHP 8.3 et extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, fileinfo, redis
          coverage: none

      - name: Contrôle syntaxique (Linting) sur le Back-End
        run: |
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              FAILED=1
            fi
          done < <(find Backend -name "*.php" -print0)
          exit $FAILED

      - name: Chargement du schéma et du jeu d'essai PostgreSQL
        env:
          PGPASSWORD: pointeresto_pass
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          SQL_FILE=$(find . -iname "migration.sql" | head -n 1)
          if [ -z "$SQL_FILE" ]; then
            echo "Fichier migration.sql introuvable"
            exit 1
          fi
          psql -h 127.0.0.1 -U pointeresto_user -d pointeresto_test -v ON_ERROR_STOP=1 -f "$SQL_FILE"

      - name: Exécution des tests automatisés
        env:
          APP_ENV: development
          APP_SECRET: pointeresto-ci-test-secret-2026
          DATABASE_URL: postgresql://pointeresto_user:pointeresto_pass@127.0.0.1:5432/pointeresto_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_URL: redis://127.0.0.1:6379
        run: php Backend/tests/run_tests.php

  build-docker:
    name: Build & Validation HTTP Conteneur Docker
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Construction de l'image Docker Back-End
        run: docker build -t pointeresto-backend:${{ github.sha }} .

      - name: Démarrage et test HTTP du conteneur PHP 8.3
        run: |
          docker run -d --name test-api -p 8000:8000 pointeresto-backend:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:8000/Index.php?route=health" | grep -q '"status":"ok"'; then
              echo "Conteneur opérationnel sur le port 8000."
              exit 0
            fi
            sleep 1
          done
          docker logs test-api
          exit 1

      - name: Nettoyage du conteneur de test
        if: always()
        run: docker rm -f test-api || true