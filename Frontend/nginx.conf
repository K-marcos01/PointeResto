server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index Connexion.html Index.html;

    sendfile off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location /Assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /Connexion.html =404;
    }
}